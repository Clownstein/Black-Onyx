[project]
name = "black-onyx-contracts"
version = "0.1.0"
description = "Shared event envelope and contract models for Black Onyx detection"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "python-ulid>=3.0",
]

[project.optional-dependencies]
schema = [
  "jsonschema>=4.23",
  "referencing>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/black_onyx_contracts"]
