[project]
name = "black-onyx-vector"
version = "0.1.0"
description = "Shared Qdrant vector-search client and collection definitions for Black Onyx"
requires-python = ">=3.12"
dependencies = [
  "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/black_onyx_vector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
