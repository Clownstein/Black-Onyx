[project]
name = "black-onyx-calibration"
version = "0.1.0"
description = "Shared Platt and isotonic calibration for Black Onyx modality models"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
sklearn = [
  "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/black_onyx_calibration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
