[project]
name = "black-onyx-sandbox"
version = "0.1.0"
description = "Sandboxed execution engine for security tooling merged from model-tools/sandbox"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/black_onyx_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
