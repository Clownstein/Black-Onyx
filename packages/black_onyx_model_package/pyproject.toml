[project]
name = "black-onyx-model-package"
version = "0.1.0"
description = "Signed model package builder and verifier for Black Onyx"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/black_onyx_model_package"]

[tool.pytest.ini_options]
testpaths = ["tests"]
