# PAUSED: open-pull-requests-limit set to 0 across ecosystems to stop
# Dependabot PR flood while security alerts catch up on main. Restore
# previous limits (3/5) when ready to re-enable automated bumps.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - web
    commit-message:
      prefix: deps
      include: scope
    groups:
      # Security updates were opening one PR per package; batch them.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      eslint-toolchain:
        applies-to: version-updates
        patterns:
          - eslint
          - "@eslint/js"
          - typescript-eslint
          - globals
          - typescript
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    ignore:
      # Compiler majors require a supported parser and coordinated build checks.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: uv
    directories:
      - /
      - /black-onyx-tools
      - /detection
      - /detection/models/code-model
      - /detection/models/host-state-model
      - /detection/models/log-model
      - /detection/models/malware-static
      - /detection/models/metrics-model
      - /detection/models/network-model
      - /services/asset-registry
      - /services/code-enrichment-worker
      - /services/code-processor
      - /services/correlation-engine
      - /services/embedding-worker
      - /services/firewall-processor
      - /services/flow-processor
      - /services/host-state-processor
      - /services/ids-processor
      - /services/incident-api
      - /services/inference-worker
      - /services/integration-hub
      - /services/malware-orchestrator
      - /services/malware-processor
      - /services/malware-triage
      - /services/metrics-processor
      - /services/model-gateway
      - /services/notification-service
      - /services/response-orchestrator
      - /services/security-gateway
      - /services/security-runner
      - /services/smoke-consumer
      - /services/threat-intel-service
      - /services/training-orchestrator
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    # Keep the queue small; prefer batched groups over per-service PR spam.
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - python
    commit-message:
      prefix: deps
      include: scope
    groups:
      # Without a security-updates group, Dependabot opens one PR per
      # directory×package for advisories (certifi/mako flood).
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"
      uv-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    # Torch/vision minors also change the CUDA and native inference stack.
    ignore:
      - dependency-name: torch
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: torchvision
        update-types: [version-update:semver-minor, version-update:semver-major]

  # Services with pyproject.toml but no uv.lock (requirements resolved by pip).
  - package-ecosystem: pip
    directories:
      - /services/log-processor
      - /services/profile-evaluator
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 0
    labels: [dependencies, python]
    commit-message:
      prefix: deps
      include: scope
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      pip-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /deploy/e2e
      - /detection/models/code-model
      - /detection/models/host-state-model
      - /detection/models/log-model
      - /detection/models/metrics-model
      - /detection/models/network-model
      - /services/asset-registry
      - /services/code-enrichment-worker
      - /services/code-processor
      - /services/correlation-engine
      - /services/embedding-worker
      - /services/firewall-processor
      - /services/flow-processor
      - /services/host-state-processor
      - /services/ids-processor
      - /services/incident-api
      - /services/inference-worker
      - /services/integration-hub
      - /services/ingestion-gateway
      - /services/log-processor
      - /services/malware-orchestrator
      - /services/malware-processor
      - /services/malware-triage
      - /services/metrics-processor
      - /services/model-gateway
      - /services/notification-service
      - /services/profile-evaluator
      - /services/response-orchestrator
      - /services/security-gateway
      - /services/security-runner
      - /services/smoke-consumer
      - /services/threat-intel-service
      - /services/training-orchestrator
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - containers
    commit-message:
      prefix: deps
      include: scope
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
      docker-shared-images:
        applies-to: version-updates
        patterns:
          - "*"
    # Runtime migrations require native-wheel and final-image acceptance.
    # Python 3.12 -> 3.14 is a SemVer minor change, not a major change.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: docker-compose
    directories:
      - /
      - /detection/infrastructure/docker-compose
      - /deploy/detection/compose
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - containers
    commit-message:
      prefix: deps
      include: scope
    groups:
      compose-security:
        applies-to: security-updates
        patterns:
          - "*"
      compose-shared-images:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      # Locally built images are released by this repository, not Docker Hub.
      - dependency-name: black-onyx
      - dependency-name: "black-onyx/*"
      # Stateful major migrations have separate acceptance and rollback gates.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: opensearchproject/opensearch
        update-types: [version-update:semver-major]
      - dependency-name: mlflow/mlflow
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
      - dependency-name: grafana/grafana
        update-types: [version-update:semver-major]
      - dependency-name: grafana/tempo
        update-types: [version-update:semver-major]
      - dependency-name: redpandadata/redpanda
        update-types: [version-update:semver-major]

  - package-ecosystem: helm
    directory: /deploy/detection/helm/black-onyx-detection
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - kubernetes
    commit-message:
      prefix: deps
      include: scope
    ignore:
      # Internal application images are promoted by the release workflow.
      - dependency-name: "black-onyx/*"

  - package-ecosystem: terraform
    directories:
      - /deploy/detection/terraform/modules/kafka
      - /deploy/detection/terraform/modules/postgres
      - /deploy/detection/terraform/modules/redis
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - infrastructure
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: deps
      include: scope
