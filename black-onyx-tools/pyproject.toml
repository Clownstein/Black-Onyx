[project]
name = "black-onyx-tools"
version = "0.1.0"
description = "MCP tool servers for Black Onyx TIP and detection plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.6.0,<2.0.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.7.0",
  "dnspython>=2.6.0",
  "python-whois>=0.9.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.25.0",
  "respx>=0.22.0",
]

[project.scripts]
black-onyx-tip-mcp = "black_onyx_tools.servers.tip_server:main"
black-onyx-detection-mcp = "black_onyx_tools.servers.detection_server:main"
black-onyx-ops-mcp = "black_onyx_tools.servers.ops_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/black_onyx_tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
