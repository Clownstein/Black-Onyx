{{- if .Values.networkPolicy.allowRules }}
# Allow ingress-controller → edge pods (application + ingestion).
{{- if .Values.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: {{ .Values.namespaces.application }}
  labels:
    {{- include "black-onyx-detection.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace | default "ingress-nginx" }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.service.port }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-incident-api
  namespace: {{ .Values.namespaces.application }}
  labels:
    {{- include "black-onyx-detection.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: incident-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace | default "ingress-nginx" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.processing }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.models }}
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.incidentApi.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-ingestion-gateway
  namespace: {{ .Values.namespaces.ingestion }}
  labels:
    {{- include "black-onyx-detection.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: ingestion-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace | default "ingress-nginx" }}
      ports:
        - protocol: TCP
          port: {{ .Values.ingestionGateway.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-processing-to-models
  namespace: {{ .Values.namespaces.models }}
  labels:
    {{- include "black-onyx-detection.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.processing }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.application }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: {{ .Values.namespaces.processing }}
  labels:
    {{- include "black-onyx-detection.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.application }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.ingestion }}
{{- end }}
