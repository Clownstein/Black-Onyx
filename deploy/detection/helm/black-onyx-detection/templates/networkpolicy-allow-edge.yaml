{{- range $model := list "log" "network" "metrics" "code" "hostState" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-model-gateway-to-{{ $model | kebabcase }}-model
  namespace: {{ $.Values.namespaces.models }}
  labels:
    {{- include "black-onyx-detection.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ $model | kebabcase }}-model
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: model-gateway
      ports:
        - protocol: TCP
          port: {{ index $.Values (printf "%sModel" $model) "service" "port" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: {{ .Values.namespaces.processing }}
  labels:
    {{- include "black-onyx-detection.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Model replicas and the model gateway poll serving state / download signed
# packages from the training orchestrator.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-models-to-training-orchestrator
  namespace: {{ .Values.namespaces.training }}
  labels:
    {{- include "black-onyx-detection.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: training-orchestrator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.models }}
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [model-gateway, log-model, code-model, network-model, metrics-model, host-state-model]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.application }}
          podSelector:
            matchLabels:
              app: black-onyx
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.trainingOrchestrator.service.port }}
{{- end }}
