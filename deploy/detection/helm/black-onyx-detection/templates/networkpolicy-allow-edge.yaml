{{- if .Values.networkPolicy.allowRules }}
# Allow ingress-controller → edge pods (application + ingestion).
{{- if .Values.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: {{ .Values.namespaces.application }}
  labels:
    {{- include "black-onyx-detection.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace | default "ingress-nginx" }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.service.port }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-incident-api
  namespace: {{ .Values.namespaces.application }}
  labels:
    {{- include "black-onyx-detection.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: incident-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace | default "ingress-nginx" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.processing }}
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [correlation-engine, code-enrichment-worker, inference-worker]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.application }}
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [black-onyx, integration-hub, profile-evaluator, asset-registry]
      ports:
        - protocol: TCP
          port: {{ .Values.incidentApi.service.port }}
---
