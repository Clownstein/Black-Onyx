apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-processor
  namespace: {{ .Values.namespaces.processing }}
  labels:
    {{- include "black-onyx-detection.labels" . | nindent 4 }}
    app: flow-processor
spec:
  replicas: {{ .Values.flowProcessor.replicaCount }}
  selector:
    matchLabels:
      app: flow-processor
  template:
    metadata:
      labels:
        app: flow-processor
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
      containers:
        - name: flow-processor
          image: {{ .Values.flowProcessor.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.flowProcessor.service.port }}
          resources:
            {{- toYaml .Values.flowProcessor.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.flowProcessor.service.port }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.flowProcessor.service.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: flow-processor
  namespace: {{ .Values.namespaces.processing }}
spec:
  selector:
    app: flow-processor
  ports:
    - port: {{ .Values.flowProcessor.service.port }}
      targetPort: {{ .Values.flowProcessor.service.port }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flow-processor
  namespace: {{ .Values.namespaces.processing }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: flow-processor
{{- end }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flow-processor
  namespace: {{ .Values.namespaces.processing }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flow-processor
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
