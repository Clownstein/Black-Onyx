{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: black-onyx-detection-edge
  namespace: {{ .Values.namespaces.application }}
  labels:
    {{- include "black-onyx-detection.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
{{- if .Values.frontend.enabled }}
    - host: {{ .Values.ingress.hosts.frontend | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
    - host: {{ .Values.ingress.hosts.incidentApi | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: incident-api
                port:
                  number: {{ .Values.incidentApi.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: black-onyx-detection-ingest
  namespace: {{ .Values.namespaces.ingestion }}
  labels:
    {{- include "black-onyx-detection.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.ingestionGateway | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingestion-gateway
                port:
                  number: {{ .Values.ingestionGateway.service.port }}
{{- end }}
