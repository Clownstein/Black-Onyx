apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: {{ .Values.namespaces.application }}
  labels:
    {{- include "black-onyx-detection.labels" . | nindent 4 }}
    app: notification-service
spec:
  replicas: {{ .Values.notificationService.replicaCount }}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
      containers:
        - name: notification-service
          image: {{ .Values.notificationService.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.notificationService.service.port }}
          env:
            - name: NOTIFICATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.name is required" .Values.secrets.name }}
                  key: {{ required "notification database secret key is required" .Values.secrets.databaseKeys.notificationService }}
            - name: NOTIFICATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: notificationApiKey
            - name: NOTIFICATION_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: notificationWebhookSecret
                  optional: true
            - name: NOTIFICATION_WEBHOOK_URL
              value: {{ .Values.notificationService.webhookUrl | quote }}
            - name: NOTIFICATION_DEFAULT_EMAIL_TO
              value: {{ .Values.notificationService.defaultEmailTo | quote }}
            - name: SMTP_HOST
              value: {{ .Values.notificationService.smtpHost | quote }}
            - name: SMTP_PORT
              value: {{ .Values.notificationService.smtpPort | quote }}
            - name: SMTP_USERNAME
              value: {{ .Values.notificationService.smtpUsername | quote }}
            - name: SMTP_FROM
              value: {{ .Values.notificationService.smtpFrom | quote }}
            - name: SMTP_STARTTLS
              value: {{ .Values.notificationService.smtpStarttls | quote }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: notificationSmtpPassword
                  optional: true
          resources:
            {{- toYaml .Values.notificationService.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.notificationService.service.port }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.notificationService.service.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: {{ .Values.namespaces.application }}
spec:
  selector:
    app: notification-service
  ports:
    - port: {{ .Values.notificationService.service.port }}
      targetPort: {{ .Values.notificationService.service.port }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-service
  namespace: {{ .Values.namespaces.application }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: notification-service
{{- end }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service
  namespace: {{ .Values.namespaces.application }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
