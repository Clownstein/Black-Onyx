{{- if .Values.networkPolicy.denyIngressDefault }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress-default
  namespace: {{ .Values.namespaces.application }}
  labels:
    {{- include "black-onyx-detection.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
