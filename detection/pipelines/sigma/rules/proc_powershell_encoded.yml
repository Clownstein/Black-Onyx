title: Encoded PowerShell Command Line
id: aa-proc-powershell-encoded
status: stable
level: high
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID:
      - 4688
      - 1
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  keywords:
    - ' -enc '
    - ' -EncodedCommand '
    - ' -e '
  condition: selection
mitre_techniques:
  - T1059.001
falsepositives:
  - Legitimate admin scripts using -EncodedCommand
