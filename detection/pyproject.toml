[project]
name = "black-onyx-detection"
version = "0.1.0"
description = "Black Onyx detection-plane test/dev meta-package (services and models build from their own Docker contexts)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "jsonschema>=4.23",
  "sqlalchemy>=2.0",
  "respx>=0.21",
  "black-onyx-contracts",
  "black-onyx-otel",
  "black-onyx-vector",
  "black-onyx-calibration",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv.sources]
black-onyx-contracts = { path = "../packages/black_onyx_contracts" }
black-onyx-otel = { path = "../packages/black_onyx_otel" }
black-onyx-calibration = { path = "../packages/black_onyx_calibration" }
black-onyx-vector = { path = "../packages/black_onyx_vector" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
