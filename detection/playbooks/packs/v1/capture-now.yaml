id: capture-now
version: "1.0.0"
name: Selective PCAP capture now
description: >
  Trigger a short PCAP excerpt on a sensor/asset for an incident.
  Requires human approval; defaults to dry-run.
mitre:
  - T1040
approval:
  required: true
  roles: [analyst, admin]
dry_run:
  default: true
inputs:
  - name: asset_id
    type: string
    required: true
  - name: seconds
    type: integer
    default: 30
steps:
  - id: validate
    action: validate_asset
  - id: request_approval
    action: create_response_request
  - id: capture
    action: capture_now
    when: approved
    dry_run_skips_live: true
audit:
  retain_days: 365
