id: block-ip-pfsense
version: "1.0.0"
name: Block IP on pfSense
description: >
  Request a pfSense/OPNsense firewall alias/block for a source or destination IP
  associated with an incident. Requires human approval; defaults to dry-run.
mitre:
  - T1048
  - T1071
approval:
  required: true
  roles: [analyst, admin]
dry_run:
  default: true
inputs:
  - name: ip
    type: ipv4
    required: true
  - name: direction
    type: enum
    values: [inbound, outbound, both]
    default: both
  - name: ttl_minutes
    type: integer
    default: 60
steps:
  - id: validate
    action: validate_ip
  - id: request_approval
    action: create_response_request
    playbook_ref: packs/v1/block-ip-pfsense
  - id: apply_block
    action: pfsense.block_ip
    when: approved
    dry_run_skips_live: true
audit:
  retain_days: 365
