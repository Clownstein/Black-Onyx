  inference-worker:
    environment:
      INFER_INCIDENT_API_URL: https://incident-api:8083
      INFER_MODEL_GATEWAY_URL: https://model-gateway:8091
      SSL_CA_CERTS: /tls/ca.crt
    volumes:
      - <<: *tls-vol

  response-orchestrator:
    volumes:
      - <<: *tls-vol
    command:
      [
        "uvicorn",
        "response_orchestrator.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8111",
        "--ssl-certfile",
        "/tls/response-orchestrator.crt",
        "--ssl-keyfile",
