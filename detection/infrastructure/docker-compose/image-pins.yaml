# Pinned third-party / base image tags for the Black Onyx detection plane (no :latest).
# Prefer digest pins when Docker is available:
#   uv run python scripts/development/pin_image_digests.py
#
# Compose / Dockerfiles currently use the tags below.

python_runtime: python:3.12.14-slim
# services/ingestion-gateway and Dockerfile.local-ca-golang build on bookworm.
golang_builder: golang:1.23.10-bookworm
distroless: gcr.io/distroless/static-debian12:nonroot
# Dockerfile.local-ca-node.
node_builder: node:20.19.3-bookworm-slim
# Dockerfile.local-ca-nginx.
nginx_runtime: nginx:1.27.5

postgres: postgres:16.9-alpine
redis: redis:7.4.4-alpine
redpanda: docker.redpanda.com/redpandadata/redpanda:v24.3.9
opensearch: opensearchproject/opensearch:2.19.1
# quay.io: Docker Hub denies anonymous pulls of minio/minio.
minio: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
qdrant: qdrant/qdrant:v1.19.1
mlflow: ghcr.io/mlflow/mlflow:v2.22.1
backup_utility: alpine:3.21.3

otel_collector: otel/opentelemetry-collector:0.123.1
prometheus: prom/prometheus:v3.2.1
postgres_exporter: prometheuscommunity/postgres-exporter:v0.15.0
redis_exporter: oliver006/redis_exporter:v1.92.0
blackbox_exporter: prom/blackbox-exporter:v0.28.0
alertmanager: prom/alertmanager:v0.28.1
loki: grafana/loki:3.7.8
tempo: grafana/tempo:2.7.1
grafana: grafana/grafana:11.6.0
alloy: grafana/alloy:v1.7.1
osquery: osquery/osquery:5.15.0
