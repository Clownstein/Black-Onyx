# Optional OTEL collector overlay for Black Onyx (joins root Compose default network).
#
# From repo root:
#   docker compose -f docker-compose.yml -f docker-compose.platform.yml \
#     -f detection/infrastructure/docker-compose/docker-compose.otel.yml up -d
#
# Then set on Python services:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318

services:
  otel-collector:
    image: otel/opentelemetry-collector:0.123.1
    container_name: blackonyx-otel-collector
    networks: [default]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
