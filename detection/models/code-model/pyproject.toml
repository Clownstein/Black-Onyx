[project]
name = "code-model"
version = "0.1.0"
description = "Hybrid local encoder + sklearn change-risk scorer"
requires-python = ">=3.12"
dependencies = [
  "black-onyx-calibration",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pyyaml>=6.0",
  "torch>=2.2",
  "onnx>=1.16",
  "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_model"]

[tool.uv.sources]
black-onyx-calibration = { path = "../../../packages/black_onyx_calibration" }

[tool.pytest.ini_options]
testpaths = ["tests"]
