[project]
name = "host-state-model"
version = "0.1.0"
description = "Minimal host-state anomaly scorer (pass-through calibrated) + /v1/predict"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
host-state-model-serve = "inference.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["host_state_model", "inference"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
