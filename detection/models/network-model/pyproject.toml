[project]
name = "network-model"
version = "0.1.0"
description = "Compact flow transformer (h=128, L=3) with ONNX inference"
requires-python = ">=3.12"
dependencies = [
  "black-onyx-calibration",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "numpy>=1.26",
  "torch>=2.2",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["network_model"]

[tool.uv.sources]
black-onyx-calibration = { path = "../../../packages/black_onyx_calibration" }

[tool.pytest.ini_options]
testpaths = ["tests"]
