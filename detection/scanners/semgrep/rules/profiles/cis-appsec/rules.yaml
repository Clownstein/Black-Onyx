rules:
  - id: cis-appsec-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      subprocess call with shell=True can enable command injection (CIS
      Controls v8 16.11 secure application development).
    metadata:
      profile: cis-appsec
      category: security
      cwe: "CWE-78"
      cis_control: "16.11"
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)

  - id: cis-appsec-insecure-yaml-load
    languages: [python]
    severity: WARNING
    message: >-
      yaml.load without a SafeLoader can construct arbitrary Python objects.
      Use yaml.safe_load (CIS Controls v8 16 secure coding).
    metadata:
      profile: cis-appsec
      category: security
      cwe: "CWE-20"
      cis_control: "16.11"
    patterns:
      - pattern: yaml.load($X)

  - id: cis-appsec-disabled-tls-verify
    languages: [python]
    severity: WARNING
    message: >-
      Disabling TLS certificate verification (verify=False) breaks transport
      security (CIS Controls v8 16 / 3 data protection).
    metadata:
      profile: cis-appsec
      category: security
      cwe: "CWE-295"
      cis_control: "16.11"
    patterns:
      - pattern-either:
          - pattern: requests.$METHOD(..., verify=False, ...)
          - pattern: httpx.$METHOD(..., verify=False, ...)
