{
  "queries": {
    "process_snapshot": {
      "query": "SELECT pid, parent AS ppid, name, path, cmdline, uid, start_time FROM processes;",
      "interval": 300,
      "description": "Process inventory for host-state.raw"
    },
    "listening_ports": {
      "query": "SELECT pid, protocol, address, port FROM listening_ports;",
      "interval": 300
    },
    "logged_in_users": {
      "query": "SELECT user, type, tty, host, time FROM logged_in_users;",
      "interval": 120
    },
    "startup_items": {
      "query": "SELECT name, path, source FROM startup_items;",
      "interval": 3600
    }
  }
}
