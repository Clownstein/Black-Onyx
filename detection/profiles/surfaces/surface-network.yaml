pack_id: surface-network
kind: surface
version: '1.0'
title: Network Surface Checks
extends_surfaces:
- network
checks:
- check_id: surface.network.segmentation
  title: Trust-zone segmentation
  surfaces:
  - network
  automation: auto
  severity_default: high
  evidence_types:
  - detector_hit
  bindings:
    detectors:
    - cross_zone_flow
- check_id: surface.network.egress
  title: Egress and DNS monitoring
  surfaces:
  - network
  automation: auto
  severity_default: medium
  evidence_types:
  - detector_hit
  bindings:
    detectors:
    - new_external_peer
    - beaconing_heuristic
- check_id: surface.network.discovery
  title: Port scan / service discovery alerts
  surfaces:
  - network
  automation: auto
  severity_default: medium
  evidence_types:
  - detector_hit
  mitre_techniques:
  - T1046
  bindings:
    detectors:
    - port_scan_heuristic
