[project]
name = "smoke-consumer"
version = "0.1.0"
description = "Consumes logs.raw and upserts into Postgres for Phase 0 smoke verification"
requires-python = ">=3.12"
dependencies = [
  "black-onyx-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "kafka-python>=2.0.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "alembic>=1.14",
]

[project.scripts]
smoke-consumer = "smoke_consumer.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smoke_consumer"]

[tool.uv.sources]
black-onyx-contracts = { path = "../../packages/black_onyx_contracts" }
