[project]
name = "embedding-worker"
version = "0.1.0"
description = "Embed findings with SecureBERT 2.0 and upsert vectors into Qdrant"
requires-python = ">=3.12"
dependencies = [
  "black-onyx-vector",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "kafka-python>=2.0.2",
  "httpx>=0.27",
  "sentence-transformers>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[project.scripts]
embedding-worker = "embedding_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embedding_worker"]

[tool.uv.sources]
black-onyx-vector = { path = "../../packages/black_onyx_vector" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
