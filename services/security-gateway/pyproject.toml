[project]
name = "security-gateway"
version = "1.0.0"
description = "Security tooling gateway receives BFF-proxied requests, dispatches to the security runner"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "black-onyx-sandbox",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["security_gateway"]

[tool.uv.sources]
black-onyx-sandbox = { path = "../../packages/black_onyx_sandbox", editable = true }
