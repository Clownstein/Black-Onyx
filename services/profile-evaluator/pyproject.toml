[project]
name = "profile-evaluator"
version = "0.1.0"
description = "Periodic security-profile evaluation + synthetic compliance-regression findings"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "respx>=0.21",
]

[project.scripts]
profile-evaluator = "profile_evaluator.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["profile_evaluator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
