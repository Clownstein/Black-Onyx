[project]
name = "correlation-engine"
version = "0.1.0"
description = "Correlate modality findings into incidents"
requires-python = ">=3.12"
dependencies = [
  "black-onyx-contracts",
  "black-onyx-otel",
  "aiokafka>=0.11",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-ulid>=3.0",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
correlation-engine = "correlation_engine.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["correlation_engine"]

[tool.uv.sources]
black-onyx-contracts = { path = "../../packages/black_onyx_contracts" }
black-onyx-otel = { path = "../../packages/black_onyx_otel" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
