[project]
name = "flow-processor"
version = "0.1.0"
description = "Normalize network.raw flows, build windows, run detectors, publish network.features"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "kafka-python>=2.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
flow-processor = "flow_processor.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flow_processor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
