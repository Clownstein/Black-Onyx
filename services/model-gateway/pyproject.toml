[project]
name = "model-gateway"
version = "0.1.0"
description = "Routes predict traffic by model alias with canary and shadow support"
requires-python = ">=3.12"
dependencies = [
  "black-onyx-otel",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[project.scripts]
model-gateway = "model_gateway.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_gateway"]

[tool.uv.sources]
black-onyx-otel = { path = "../../packages/black_onyx_otel" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
