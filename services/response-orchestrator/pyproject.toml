[project]
name = "response-orchestrator"
version = "0.1.0"
description = "Approval-gated SOAR playbook execution (block_ip, isolate_host, capture_now, block_c2)"
requires-python = ">=3.12"
dependencies = [
  "black-onyx-otel",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
]

[tool.uv.sources]
black-onyx-otel = { path = "../../packages/black_onyx_otel" }

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
response-orchestrator = "response_orchestrator.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["response_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
