[project]
name = "code-processor"
version = "0.1.0"
description = "Code webhook processing, diff extraction, scanner findings prep"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "kafka-python>=2.0.2",
  "pyyaml>=6.0",
  "semgrep>=1.90,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
code-processor = "code_processor.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_processor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
