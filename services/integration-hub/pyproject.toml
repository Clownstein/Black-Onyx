[project]
name = "integration-hub"
version = "0.1.0"
description = "Integration hub: vuln ingest, SIEM, TheHive, response approvals, DFIR"
requires-python = ">=3.12"
dependencies = [
  "black-onyx-contracts",
  "black-onyx-otel",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-ulid>=3.0",
  "pyyaml>=6.0",
  "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "respx>=0.21",
]

[project.scripts]
integration-hub = "integration_hub.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["integration_hub"]

[tool.uv.sources]
black-onyx-contracts = { path = "../../packages/black_onyx_contracts" }
black-onyx-otel = { path = "../../packages/black_onyx_otel" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
