[project]
name = "training-orchestrator"
version = "0.1.0"
description = "MLOps training orchestrator, promotion, drift, and model packaging"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "alembic>=1.14",
  "black-onyx-calibration>=0.1.0",
  "black-onyx-model-package>=0.1.0",
]

[project.optional-dependencies]
training = [
  "numpy>=1.26",
  "torch>=2.4",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "onnx>=1.16",
  "onnxscript>=0.2",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[project.scripts]
training-orchestrator = "training_orchestrator.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["training_orchestrator"]

[tool.uv.sources]
black-onyx-calibration = { path = "../../packages/black_onyx_calibration" }
black-onyx-model-package = { path = "../../packages/black_onyx_model_package" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
