[project]
name = "inference-worker"
version = "0.1.0"
description = "Consume feature topics, score via model-gateway, publish findings"
requires-python = ">=3.12"
dependencies = [
  "black-onyx-contracts",
  "aiokafka>=0.11",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-ulid>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "respx>=0.21",
]

[project.scripts]
inference-worker = "inference_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inference_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
black-onyx-contracts = { path = "../../packages/black_onyx_contracts" }
