[project]
name = "security-runner"
version = "1.0.0"
description = "Docker-owning authenticated runner for security tool execution"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "docker>=7.1.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
# httpx backs fastapi.testclient.TestClient, which the auth tests use.
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["security_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
