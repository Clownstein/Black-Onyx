[project]
name = "threat-intel-service"
version = "0.1.0"
description = "Threat intelligence indicator store and match API"
requires-python = ">=3.12"
dependencies = [
  "black-onyx-contracts",
  "black-onyx-otel",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "python-ulid>=3.0",
  "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[project.scripts]
threat-intel-service = "threat_intel_service.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["threat_intel_service"]

[tool.uv.sources]
black-onyx-contracts = { path = "../../packages/black_onyx_contracts" }
black-onyx-otel = { path = "../../packages/black_onyx_otel" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
